name: Google Scholar Crawler (SerpApi)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * *"   # 每天 08:00 UTC 运行
  push:
    branches: [ main, gh-pages ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Fetch Scholar via SerpApi
        env:
          GOOGLE_SCHOLAR_ID: ${{ secrets.GOOGLE_SCHOLAR_ID }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
        run: python google_scholar_crawler/serpapi_fetch.py

      - name: Publish results to gh-pages/assets/data
        shell: bash
        run: |
          set -e
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          # 切到 gh-pages 分支（存在则 checkout，不存在就新建空分支）
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            # 不要清空根目录；第一次 orphan 分支时仅会有 .git
          fi

          mkdir -p assets/data

          if [ -d "$GITHUB_WORKSPACE/results" ] && [ "$(ls -A "$GITHUB_WORKSPACE/results")" ]; then
            cp -f "$GITHUB_WORKSPACE/results/gs_data.json" assets/data/gs_data.json || true
            cp -f "$GITHUB_WORKSPACE/results/gs_data_shieldsio.json" assets/data/gs_data_shieldsio.json || true
          else
            echo "No results generated; keep existing data."
          fi

          git add assets/data/gs_data*.json || true
          git commit -m "Update Google Scholar statistics (SerpApi → gh-pages/assets/data)" || true
          git push origin gh-pages